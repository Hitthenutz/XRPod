name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hud:
    name: HUD build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hud
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: hud/.nvmrc
          cache: npm
          cache-dependency-path: hud/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  pi:
    name: Pi controller tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Safety rules, validation, web server protections.
      # Standard library only, so the runner's built-in Python is enough.
      - name: Test Pi controller
        run: python3 -m unittest discover -s pi -v
