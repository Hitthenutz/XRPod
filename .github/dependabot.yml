version: 2
updates:
  - package-ecosystem: npm
    directory: /hud
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze must stay on the same version, or CodeQL fails.
      codeql:
        patterns: ["github/codeql-action*"]
