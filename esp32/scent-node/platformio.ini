; XRPod - Scent / IAQ ESP32 node
; Board: ESP32 WROOM-32 DevKit (USB Type-C)
; Build: PlatformIO toolbar check mark | Upload: right arrow | Monitor: plug icon

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600
; If uploads fail at 921600, drop to 460800 or 115200.
; If you have several COM ports, pin it here, e.g.:
; upload_port = COM5
; monitor_port = COM5

lib_deps =
    knolleary/PubSubClient @ ^2.8
