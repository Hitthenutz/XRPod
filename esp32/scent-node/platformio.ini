; XRPod - Scent / IAQ ESP32 node
; Board: ESP32 WROOM-32 DevKit (USB Type-C)
; Build: check mark | Upload: right arrow | Monitor: plug icon (bottom bar)

[platformio]
default_envs = esp32dev

[env]
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.1

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; If uploads fail at 921600, drop to 460800 or 115200.
; If you have several COM ports, pin it here, e.g.:
; upload_port = COM5
; monitor_port = COM5
build_src_flags = -Wall -Wextra
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit BME680 Library @ ^2.0.4
test_ignore = *

; Unit tests for lib/scent_core on your PC: `pio test -e native`
; (needs a host C++ compiler, e.g. MinGW-w64 g++ on Windows)
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
