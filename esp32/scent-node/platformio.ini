; XRPod - Scent / IAQ ESP32 node
; Board: ESP32 WROOM-32 DevKit (USB Type-C)
; Build: check mark | Upload: right arrow | Monitor: plug icon (bottom bar)

[platformio]
default_envs = esp32dev

[env]
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.1

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; echo what you type into the bench console
monitor_echo = yes
monitor_eol = LF
upload_speed = 921600
; If uploads fail at 921600, drop to 460800 or 115200.
; Port is auto-detected. If several COM ports show up, pin it here, e.g.:
; upload_port = COM3
; monitor_port = COM3
build_src_flags = -Wall -Wextra
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit BME680 Library @ ^2.0.4
test_ignore = *

; Step-through debugging (breakpoints, variables) with an ESP-Prog JTAG probe
; wired to GPIO12-15. Pick "esp32dev-debug" in the env selector, then Run >
; Start Debugging (F5). Uploads still go over USB.
[env:esp32dev-debug]
extends = env:esp32dev
build_type = debug
; verbose ESP-IDF/Arduino logs
build_flags = -DCORE_DEBUG_LEVEL=4
debug_tool = esp-prog
debug_init_break = tbreak setup
upload_protocol = esptool

; Unit tests for lib/scent_core on your PC: `pio test -e native`
; (needs a host C++ compiler, e.g. MinGW-w64 g++ on Windows)
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
