; XRPod - IAQ node: BME688 temperature / humidity / air quality on its own ESP32
; Board: any ESP32 WROOM-32 DevKit
; Build: check mark | Upload: right arrow | Monitor: plug icon (bottom bar)

[platformio]
default_envs = esp32dev

[env]
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.1

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
; If uploads fail at 921600, drop to 460800 or 115200.
; Port is auto-detected. With the scent ESP32 plugged in too, pin this
; one's port so you don't flash the wrong board, e.g.:
; upload_port = COM4
; monitor_port = COM4
build_src_flags = -Wall -Wextra
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit BME680 Library @ ^2.0.4
test_ignore = *

; Unit tests for lib/iaq_core on your PC: `pio test -e native`
; (needs a host C++ compiler, e.g. MinGW-w64 g++ on Windows)
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
