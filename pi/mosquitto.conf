# Mosquitto broker for the scent / IAQ node. Install on the Pi (see
# subsystems/iaq/README.md):
#
#   sudo cp pi/mosquitto.conf /etc/mosquitto/conf.d/xrpod.conf
#   sudo systemctl restart mosquitto
#
# Listens on the whole LAN so the ESP32 can reach it, but only with a login:
# anyone on the pod's Wi-Fi could otherwise run the atomizers.

listener 1883
allow_anonymous false
password_file /etc/mosquitto/xrpod.passwd
