; XRPod scent / IAQ node: ESP32 + 2x BME688 (BSEC2) + 2 atomizers, Wi-Fi -> MQTT.
; Build:  pio run            (must finish with 0 warnings)
; Flash:  pio run -t upload && pio device monitor
; Before the first build: cp include/secrets.example.h include/secrets.h

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    boschsensortec/bsec2@1.10.2610
    boschsensortec/BME68x Sensor library@1.3.40408
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.4.3
; Strict warnings for our code (src/) only, not the vendor libraries.
build_src_flags =
    -Wall
    -Wextra
